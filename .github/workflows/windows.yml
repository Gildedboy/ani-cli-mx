name: Windows support checks

on:
  push:
    branches:
      - main
    paths:
      - ani-cli-mx
      - ani-cli-mx-core
      - ani-cli-mx.cmd
      - tests/**
      - .github/workflows/windows.yml
  pull_request:
    paths:
      - ani-cli-mx
      - ani-cli-mx-core
      - ani-cli-mx.cmd
      - tests/**
      - .github/workflows/windows.yml

jobs:
  git-bash:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shell and Windows compatibility tests
        shell: bash
        run: ./tests/sanity.sh --syntax

      - name: Verify Scoop Git for Windows bootstrap
        shell: powershell
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
            Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          }
          scoop install git
          if ($LASTEXITCODE -ne 0) {
            throw "Scoop could not install Git for Windows"
          }
          $gitRoot = (scoop prefix git).Trim()
          $bashPath = Join-Path $gitRoot "bin\bash.exe"
          if (-not (Test-Path $bashPath)) {
            throw "Scoop Git does not contain the expected Git Bash runtime: $bashPath"
          }
          $bucketList = scoop bucket list | Out-String
          if ($bucketList -notmatch '(?m)^extras\s') {
            scoop bucket add extras
            if ($LASTEXITCODE -ne 0) {
              throw "Scoop could not add the extras bucket after installing Git"
            }
          }
          $env:GIT_INSTALL_ROOT = $gitRoot
          $version = & .\ani-cli-mx.cmd -V
          if ($version -ne "1.4.1") {
            throw "The launcher did not use Scoop Git correctly: $version"
          }

      - name: Run the Windows launcher from PowerShell
        shell: powershell
        run: |
          $version = & .\ani-cli-mx.cmd -V
          if ($version -ne "1.4.1") {
            throw "Unexpected ani-cli-mx version: $version"
          }

      - name: Verify launcher argument forwarding
        shell: powershell
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "ani-cli-mx-launcher"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          Copy-Item .\ani-cli-mx.cmd $testDir
          @'
          printf '<%s>\n' "$@"
          '@ | Set-Content -Encoding ascii -NoNewline (Join-Path $testDir "ani-cli-mx-core")
          $arguments = & (Join-Path $testDir "ani-cli-mx.cmd") "one piece" --source animeav1
          $expected = @("<one piece>", "<--source>", "<animeav1>")
          if (Compare-Object $expected $arguments) {
            throw "Launcher did not preserve arguments: $($arguments -join ', ')"
          }
