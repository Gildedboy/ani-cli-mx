name: 'ani-cli-mx shell checks'
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "ani-cli-mx"
      - "ani-cli-mx-core"
      - "ani-cli-mx.cmd"

jobs:
  sh-checker:
    name: Shellcheck + Shfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run the sh-checker
      uses: luizm/action-sh-checker@master
      env:
        SHELLCHECK_OPTS: -s sh -o all -e 2250
        SHFMT_OPTS: -i 4 -ci -d
      
  check-exec:
    name: Executable Bit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: test exec bits
      run: test -x "./ani-cli-mx" && test -x "./ani-cli-mx-core" && test -f "./ani-cli-mx.cmd"

  check-no-awk:
    name: No New Awk
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Verify that the change does not add awk usage
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        test -n "$BASE_SHA"
        ! git diff "$BASE_SHA" -- ani-cli-mx-core | grep '^+.*awk'
