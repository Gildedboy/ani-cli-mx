name: 'ani-cli-mx shell checks'
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "ani-cli-mx"
      - "ani-cli-mx-core"
      - "ani-cli-mx.cmd"
      - "ani-cli-mx.ps1"

jobs:
  sh-checker:
    name: Shellcheck + Shfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check shell errors
      run: shellcheck --severity=error -s sh ani-cli-mx ani-cli-mx-core tests/sanity.sh
    - name: Run syntax and compatibility tests
      run: ./tests/sanity.sh --syntax
      
  check-exec:
    name: Executable Bit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: test exec bits
      run: test -x "./ani-cli-mx" && test -x "./ani-cli-mx-core" && test -f "./ani-cli-mx.cmd" && test -f "./ani-cli-mx.ps1"

  check-pelisplus-unpacker:
    name: PelisPlus unpacker dependency
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify that awk is declared for the P.A.C.K.E.R. resolver
      run: |
        grep -q 'dep_ch "openssl" "awk" "od" "dd"' ani-cli-mx-core
        grep -q 'P\.A\.C\.K\.E\.R\. handling passed' tests/sanity.sh
